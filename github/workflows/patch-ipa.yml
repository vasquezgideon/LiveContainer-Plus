name: Patch IPA (lite)

# Lite mode for when you only have an IPA: injects a small dylib into it (window menu with snap presets,
# hide-bar mode, "new instance" in a spare container). The full LC Plus features need the source build
# ("Build LC Plus"), because they change LiveContainer's own code.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which LiveContainer IPA to patch"
        type: choice
        default: stable-sidestore
        options: [stable-sidestore, stable, nightly-sidestore, nightly, custom-url]
      custom_url:
        description: "Direct IPA URL (only used when source = custom-url)"
        type: string
        default: ''
  push:
    paths: ['input/*.ipa']   # upload your own IPA into input/ to patch it

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the IPA
        env:
          SOURCE: ${{ inputs.source }}
          CUSTOM: ${{ inputs.custom_url }}
        run: |
          set -euo pipefail
          mkdir -p work out
          base=https://github.com/LiveContainer/LiveContainer/releases
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            f=$(ls input/*.ipa | head -1); cp "$f" work/in.ipa; echo "TAG=custom" >> "$GITHUB_ENV"
          else
            case "${SOURCE:-stable-sidestore}" in
              stable)            url="$base/latest/download/LiveContainer.ipa" ;;
              stable-sidestore)  url="$base/latest/download/LiveContainer+SideStore.ipa" ;;
              nightly)           url="$base/download/nightly/LiveContainer.ipa" ;;
              nightly-sidestore) url="$base/download/nightly/LiveContainer+SideStore.ipa" ;;
              custom-url)        url="$CUSTOM" ;;
            esac
            echo "downloading $url"
            curl -fL --retry 3 -o work/in.ipa "$url"
            echo "TAG=${SOURCE:-stable-sidestore}" >> "$GITHUB_ENV"
          fi
          ls -l work/in.ipa

      - name: Build LCPlus.dylib
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
            -miphoneos-version-min=15.0 -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/LCPlus.dylib \
            -o work/LCPlus.dylib lite/tweak/LCPlus.m
          codesign -f -s - work/LCPlus.dylib

      - name: Build insert_dylib
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib work/insert_dylib_src
          clang -o work/insert_dylib "$(find work/insert_dylib_src -name main.c | head -1)"

      - name: Inject
        run: |
          set -euo pipefail
          ./lite/scripts/inject.sh work/in.ipa work/LCPlus.dylib "out/LiveContainer-LCPlusLite-${TAG}.ipa" work/insert_dylib

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "lcplus-lite-${GITHUB_RUN_NUMBER}" out/*.ipa \
            --title "LC Plus lite (${TAG}) #${GITHUB_RUN_NUMBER}" \
            --notes "Lite patch: window menu (snap presets, hide bar, new instance in a spare container). Log: Documents/LCPlus.log" \
            --prerelease
