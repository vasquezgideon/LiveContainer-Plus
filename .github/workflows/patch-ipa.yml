name: Patch IPA (Lite)

# Lite mode for when only an IPA is available. Injects a small library that adds a window menu (snap presets,
# hide bar, new instance in a spare container). The full feature set needs "Build LiveContainer Plus", because it changes
# LiveContainer's own code.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "IPA to patch"
        type: choice
        default: stable-sidestore
        options: [stable-sidestore, stable, nightly-sidestore, nightly, uploaded, url]
      ipa_url:
        description: "Direct https link to an IPA (source = url)"
        type: string
        default: ''

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get IPA
        env:
          SOURCE: ${{ inputs.source }}
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p work out
          base=https://github.com/LiveContainer/LiveContainer/releases
          SOURCE="${SOURCE:-stable-sidestore}"
          case "$SOURCE" in
            stable)            curl -fL --retry 3 -o work/in.ipa "$base/latest/download/LiveContainer.ipa" ;;
            stable-sidestore)  curl -fL --retry 3 -o work/in.ipa "$base/latest/download/LiveContainer+SideStore.ipa" ;;
            nightly)           curl -fL --retry 3 -o work/in.ipa "$base/download/nightly/LiveContainer.ipa" ;;
            nightly-sidestore) curl -fL --retry 3 -o work/in.ipa "$base/download/nightly/LiveContainer+SideStore.ipa" ;;
            uploaded)
              f=$(ls input/*.ipa 2>/dev/null | head -1 || true)
              [ -n "$f" ] || { echo "::error::no .ipa found in input/"; exit 1; }
              cp "$f" work/in.ipa ;;
            url)
              case "$IPA_URL" in https://*) ;; *) echo "::error::ipa_url must be an https link"; exit 1 ;; esac
              curl -fL --retry 3 -o work/in.ipa "$IPA_URL" ;;
          esac
          echo "TAG=$SOURCE" >> "$GITHUB_ENV"
          ls -l work/in.ipa

      - name: Build library
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
            -miphoneos-version-min=15.0 -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/LCPlus.dylib \
            -o work/LCPlus.dylib lite/tweak/LCPlus.m
          codesign -f -s - work/LCPlus.dylib

      - name: Build insert_dylib
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib work/insert_dylib_src
          clang -o work/insert_dylib "$(find work/insert_dylib_src -name main.c | head -1)"

      - name: Inject
        run: |
          set -euo pipefail
          ./lite/scripts/inject.sh work/in.ipa work/LCPlus.dylib "out/LiveContainer-Lite-${TAG}.ipa" work/insert_dylib

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "lite-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" out/*.ipa \
            --title "LiveContainer Lite build ${GITHUB_RUN_NUMBER} (${TAG})" \
            --notes "Window menu patch for ${TAG}." \
            --prerelease
