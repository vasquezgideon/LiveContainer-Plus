name: Patch IPA (Lite)

# Lite mode for when only an IPA is available. Injects a small library that adds a window menu (snap presets,
# hide bar, new instance in a spare container). The full feature set needs "Build LiveContainer Plus", because it changes
# LiveContainer's own code.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "IPA to patch (release = an input*.ipa attached to a release of this repository)"
        type: choice
        default: stable-sidestore
        options: [stable-sidestore, stable, nightly-sidestore, nightly, release, url]
      ipa_url:
        description: "Direct https link to an IPA (source = url)"
        type: string
        default: ''

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get IPA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p work out
          base=https://github.com/LiveContainer/LiveContainer/releases
          SOURCE="${SOURCE:-stable-sidestore}"
          case "$SOURCE" in
            stable)            curl -fL --retry 3 -o work/in.ipa "$base/latest/download/LiveContainer.ipa" ;;
            stable-sidestore)  curl -fL --retry 3 -o work/in.ipa "$base/latest/download/LiveContainer+SideStore.ipa" ;;
            nightly)           curl -fL --retry 3 -o work/in.ipa "$base/download/nightly/LiveContainer.ipa" ;;
            nightly-sidestore) curl -fL --retry 3 -o work/in.ipa "$base/download/nightly/LiveContainer+SideStore.ipa" ;;
            release)
              tag=""
              for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName'); do
                if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qE '^input.*\.ipa$'; then tag=$t; break; fi
              done
              [ -n "$tag" ] || { echo "::error::no release has an asset named input.ipa"; exit 1; }
              rm -rf dl && mkdir dl
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'input*.ipa' --dir dl
              cp "$(ls dl/input*.ipa | head -1)" work/in.ipa ;;
            url)
              case "$IPA_URL" in https://*) ;; *) echo "::error::ipa_url must be an https link"; exit 1 ;; esac
              curl -fL --retry 3 -o work/in.ipa "$IPA_URL" ;;
          esac
          echo "TAG=$SOURCE" >> "$GITHUB_ENV"
          ls -l work/in.ipa

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build library
        run: |
          set -euxo pipefail
          xcodebuild -version
          test -f lite/tweak/LCPlus.m
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 -Wno-error \
            -miphoneos-version-min=15.0 -isysroot "$SDK" \
            -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/LCPlus.dylib \
            -o work/LCPlus.dylib lite/tweak/LCPlus.m
          codesign -f -s - work/LCPlus.dylib
          file work/LCPlus.dylib

      - name: Inject
        run: |
          set -euo pipefail
          ./lite/scripts/inject.sh work/in.ipa work/LCPlus.dylib "out/LiveContainer-Lite-${TAG}.ipa"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "lite-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" out/*.ipa \
            --title "LiveContainer Lite build ${GITHUB_RUN_NUMBER} (${TAG})" \
            --notes "Window menu patch for ${TAG}." \
            --prerelease
